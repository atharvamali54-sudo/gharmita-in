apply plugin: 'com.android.application'

android {
    namespace 'com.gharmitra.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.gharmitra.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // No external dependencies needed - ultra-fast pure Android build!
}
